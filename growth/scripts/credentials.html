<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>LoopKit Growth credentials</title>
</head>
<body>
  <h1>Generate LoopKit Growth credentials</h1>
  <p>Run this file locally. Generate once, save the values in your password manager, then close this tab.</p>
  <button id="generate">Generate new credentials</button>
  <p><label>Meta Muse bearer credential<br><textarea id="token" cols="75" rows="2" readonly></textarea></label></p>
  <p><label>Worker secret GROWTH_API_KEYS<br><textarea id="keys" cols="75" rows="3" readonly></textarea></label></p>
  <p><label>Shared Worker secret GROWTH_ANALYTICS_KEY<br><textarea id="analytics" cols="75" rows="2" readonly></textarea></label></p>
  <p id="status" role="status"></p>
  <script>
    const field = (id) => document.getElementById(id);
    const random = () => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32))))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

    field("generate").addEventListener("click", async () => {
      try {
        const secret = random();
        const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(secret));
        const sha256 = Array.from(new Uint8Array(digest), (byte) => byte.toString(16).padStart(2, "0")).join("");
        field("token").value = "meta-muse." + secret;
        field("keys").value = JSON.stringify({ "meta-muse": { sha256, scopes: ["read", "scan", "review"] } });
        field("analytics").value = random();
        field("status").textContent = "Credentials generated.";
      } catch {
        field("status").textContent = "Open the downloaded file directly in a current browser to generate credentials.";
      }
    });
  </script>
</body>
</html>
